<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor 2.0</title>
    <!-- Fuentes de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Great Vibes', cursive;
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #120c1f;
            color: #f3e8ff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        
        /* Panel Central Compacto */
        .container {
            width: 100%;
            max-width: 360px;
            background: rgba(20, 10, 30, 0.78);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(216, 180, 254, 0.3);
            padding: 18px 20px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 12px rgba(168, 85, 247, 0.15);
        }

        h2 {
            text-align: center;
            color: #e9d8fd;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 2px;
            font-weight: normal;
            text-shadow: 0 0 10px rgba(216, 180, 254, 0.5);
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            text-align: center;
            color: #d8b4fe;
            font-size: 11px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 2px;
            margin-bottom: 15px;
            opacity: 0.85;
            text-shadow: 0 0 6px rgba(216, 180, 254, 0.3);
        }

        /* Área para escribir con fuente Cinzel */
        textarea {
            width: 100%;
            height: 75px;
            padding: 10px;
            font-size: 15px;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
            background-color: rgba(12, 6, 20, 0.7);
            color: #f3e8ff;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #d8b4fe;
            box-shadow: 0 0 8px rgba(216, 180, 254, 0.3);
            background-color: rgba(12, 6, 20, 0.85);
        }

        .buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            flex: 1;
            background: linear-gradient(135deg, #6b21a8, #4c1d95);
            color: #f3e8ff;
            border: 1px solid rgba(216, 180, 254, 0.3);
            padding: 6px 8px;
            font-size: 19px;
            font-family: 'Great Vibes', cursive;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #7e22ce, #581c87);
            border-color: #d8b4fe;
            transform: translateY(-1px);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        h3 {
            margin-top: 0;
            margin-bottom: 4px;
            font-size: 22px;
            color: #d8b4fe;
            font-weight: normal;
        }

        /* Área del resultado con fuente Cinzel */
        .output-box {
            background-color: rgba(12, 6, 20, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 10px;
            border-radius: 12px;
            min-height: 38px;
            font-size: 15px;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
            word-break: break-all;
            white-space: pre-wrap;
            color: #f3e8ff;
        }

        .copy-btn {
            margin-top: 8px;
            width: 100%;
            background: linear-gradient(135deg, #4c1d95, #3b0764);
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Traductor 2.0</h2>
    <p class="subtitle">Toma esto como mi iniciativa para empezar a llevarnos bien. Te estoy dando la respuesta en vez de dejar que intentaras adivinarlo, valoralo.</p>
    
    <textarea id="inputText" placeholder="Escribe tu texto aquí..."></textarea>
    
    <div class="buttons">
        <button onclick="traducirAEspecial()">Español ➔ Mi Idioma</button>
        <button onclick="traducirANormal()">Mi Idioma ➔ Español</button>
    </div>

    <h3>Resultado:</h3>
    <div id="outputText" class="output-box"></div>
    <button class="copy-btn" onclick="copiarTexto()">Copiar Resultado.</button>
</div>

<script>
    // Tu abecedario personalizado
    const mapEspToCustom = {
        'a': '∆', 'b': '&', 'c': '4', 'd': '2', 'e': '=', 'f': '£',
        'g': '[', 'h': '*', 'i': '(1/000)', 'j': '✓', 'k': 'π', 'l': '★',
        'm': '(1000)', 'n': '9', 'ñ': '/', 'o': '8', 'p': '#', 'q': '@',
        'r': '-', 's': '6', 't': '3', 'u': '1', 'v': '(20)', 'w': '~',
        'x': '-', 'y': '¥', 'z': '^', ' ': '   '
    };

    // Mapeo inverso exacto
    const mapCustomToEsp = {
        '∆': 'A', '&': 'B', '4': 'C', '2': 'D', '=': 'E', '£': 'F',
        '[': 'G', '*': 'H', '(1/000)': 'I', '✓': 'J', 'π': 'K', '★': 'L',
        '(1000)': 'M', '9': 'N', '/': 'Ñ', '8': 'O', '#': 'P', '@': 'Q',
        '-': 'R', '6': 'S', '3': 'T', '1': 'U', '(20)': 'V', '~': 'W',
        '¥': 'Y', '^': 'Z', '   ': ' '
    };

    function traducirAEspecial() {
        let texto = document.getElementById('inputText').value.toLowerCase();
        let resultado = '';
        
        for (let char of texto) {
            if (mapEspToCustom[char] !== undefined) {
                resultado += mapEspToCustom[char] + ' ';
            } else {
                resultado += char;
            }
        }
        document.getElementById('outputText').innerText = resultado.trim();
    }

    function traducirANormal() {
        let texto = document.getElementById('inputText').value;
        
        let pattern = /\(1\/000\)|\(1000\)|\(20\)|\S/g;
        let tokens = texto.match(pattern) || [];
        let resultado = '';

        for (let token of tokens) {
            if (mapCustomToEsp[token]) {
                resultado += mapCustomToEsp[token];
            } else {
                resultado += token;
            }
        }
        document.getElementById('outputText').innerText = resultado;
    }

    function copiarTexto() {
        let textoResultado = document.getElementById('outputText').innerText;
        if (textoResultado) {
            navigator.clipboard.writeText(textoResultado).then(() => {
                alert('¡Texto copiado!');
            });
        }
    }
</script>

</body>
</html>
